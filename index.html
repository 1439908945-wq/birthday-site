<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>祝晓晓生日快乐</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 18% 10%, rgba(255,255,255,.92), transparent 17%),
        radial-gradient(circle at 84% 18%, rgba(255,211,232,.92), transparent 24%),
        radial-gradient(circle at 50% 92%, rgba(255,239,184,.95), transparent 26%),
        linear-gradient(135deg, #ff7eb3 0%, #ff758c 34%, #ffb86c 72%, #ffe29f 100%);
    }

    body {
      min-height: 100svh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
      pointer-events: none;
    }

    .music-button {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      z-index: 9999;
      padding: 11px 14px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      color: #db2777;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(120,24,64,.22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .music-button.playing {
      background: #fff8c7;
      color: #9a3412;
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(68px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom));
    }

    .card {
      position: relative;
      width: min(94vw, 430px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 30px 20px 28px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.34), rgba(255,255,255,.14));
      box-shadow: 0 26px 80px rgba(155, 25, 76, .28);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      overflow: hidden;
      animation: cardIn .85s ease both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -90px -70px auto;
      height: 230px;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.52), transparent 62%);
      pointer-events: none;
    }

    .content, .visual {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .content {
      text-align: center;
    }

    .tag {
      display: inline-flex;
      margin-bottom: 16px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.28);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .2px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
    }

    h1 {
      font-size: clamp(48px, 15vw, 68px);
      line-height: .96;
      letter-spacing: -2.2px;
      text-shadow: 0 12px 30px rgba(141,24,69,.24);
    }

    .name {
      display: block;
      margin-top: 8px;
      color: #fff8c7;
    }

    .desc {
      margin: 20px auto 0;
      max-width: 360px;
      font-size: 17px;
      line-height: 1.78;
      color: rgba(255,255,255,.96);
      font-weight: 700;
    }

    .wish-tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 20px;
    }

    .wish-tags span {
      display: inline-flex;
      align-items: center;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.25);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.32);
      color: rgba(255,255,255,.98);
      font-size: 13px;
      font-weight: 900;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .visual {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      margin-top: -4px;
    }

    .cake-stage {
      position: relative;
      width: min(76vw, 300px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.52), rgba(255,255,255,.08) 62%, transparent 63%);
      animation: sway 4.5s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      inset: 18px;
      border: 2px dashed rgba(255,255,255,.55);
      border-radius: 50%;
      animation: spin 24s linear infinite;
    }

    .ring.two {
      inset: 44px;
      border-style: solid;
      opacity: .30;
      animation-duration: 18s;
      animation-direction: reverse;
    }

    .cake {
      position: relative;
      width: 210px;
      height: 218px;
      transform: scale(.93);
      filter: drop-shadow(0 24px 26px rgba(121, 31, 61, .25));
      animation: floatCake 2.8s ease-in-out infinite;
    }

    .candle {
      position: absolute;
      left: 50%;
      top: 2px;
      width: 17px;
      height: 54px;
      transform: translateX(-50%);
      border-radius: 9px;
      background: repeating-linear-gradient(45deg, #fff, #fff 8px, #ff7eb3 8px, #ff7eb3 16px);
      z-index: 8;
      box-shadow: inset -3px 0 0 rgba(255, 120, 170, .25);
    }

    .flame {
      position: absolute;
      left: 50%;
      top: -26px;
      width: 28px;
      height: 36px;
      transform: translateX(-50%) rotate(8deg);
      border-radius: 50% 50% 50% 0;
      background: radial-gradient(circle at 60% 65%, #fff 0 18%, #fff4a3 19% 56%, #ff9f1c 57% 100%);
      box-shadow: 0 0 24px #fff4a3, 0 0 48px #ff9f1c;
      animation: flame 1s ease-in-out infinite alternate;
    }

    .strawberries {
      position: absolute;
      top: 52px;
      left: 42px;
      width: 126px;
      display: flex;
      justify-content: space-between;
      z-index: 7;
    }

    .strawberries i {
      width: 23px;
      height: 27px;
      border-radius: 60% 60% 70% 70%;
      background: radial-gradient(circle at 35% 35%, #fff 0 7%, transparent 8%), linear-gradient(135deg, #ff5b7f, #e11d48);
      transform: rotate(-12deg);
      box-shadow: inset -4px -5px 0 rgba(120, 0, 40, .14);
    }

    .strawberries i:nth-child(2) { transform: translateY(-8px) rotate(8deg); }
    .strawberries i:nth-child(3) { transform: rotate(16deg); }

    .cake-top {
      position: absolute;
      left: 20px;
      top: 74px;
      width: 170px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff, #fff6fb 48%, #ffd7e8 100%);
      z-index: 6;
      box-shadow: inset 0 -8px 0 rgba(255, 161, 199, .22);
    }

    .drips {
      position: absolute;
      left: 30px;
      top: 102px;
      z-index: 7;
      display: flex;
      gap: 22px;
    }

    .drips i {
      width: 18px;
      height: 36px;
      border-radius: 0 0 14px 14px;
      background: linear-gradient(180deg, #fff6fb, #ffd7e8);
      box-shadow: inset -4px -4px 0 rgba(255, 160, 200, .18);
    }

    .drips i:nth-child(2) { height: 27px; }
    .drips i:nth-child(3) { height: 42px; }
    .drips i:nth-child(4) { height: 30px; }

    .cake-mid {
      position: absolute;
      left: 20px;
      top: 101px;
      width: 170px;
      height: 78px;
      border-radius: 0 0 30px 30px;
      background: linear-gradient(180deg, #ff8fbd, #ff4f97);
      z-index: 4;
      box-shadow: inset -18px 0 0 rgba(183, 27, 94, .12);
    }

    .sprinkles {
      position: absolute;
      left: 42px;
      top: 121px;
      width: 126px;
      height: 36px;
      z-index: 8;
    }

    .sprinkles i {
      position: absolute;
      width: 16px;
      height: 5px;
      border-radius: 999px;
      background: #fff176;
      transform: rotate(22deg);
    }

    .sprinkles i:nth-child(2) { left: 24px; top: 14px; background: #7dd3fc; transform: rotate(-24deg); }
    .sprinkles i:nth-child(3) { left: 54px; top: 2px; background: #c4b5fd; transform: rotate(14deg); }
    .sprinkles i:nth-child(4) { left: 82px; top: 19px; background: #86efac; transform: rotate(-18deg); }
    .sprinkles i:nth-child(5) { left: 108px; top: 7px; background: #facc15; transform: rotate(28deg); }
    .sprinkles i:nth-child(6) { left: 38px; top: 28px; background: #fff; transform: rotate(32deg); }
    .sprinkles i:nth-child(7) { left: 72px; top: 27px; background: #fecdd3; transform: rotate(-28deg); }

    .cream {
      position: absolute;
      top: 166px;
      left: 29px;
      z-index: 7;
      display: flex;
      gap: 10px;
    }

    .cream i {
      width: 23px;
      height: 25px;
      border-radius: 50% 50% 12px 12px;
      background: #fff8fb;
      box-shadow: inset -4px -4px 0 rgba(255, 170, 205, .18);
    }

    .cake-base {
      position: absolute;
      left: 0;
      bottom: 18px;
      width: 210px;
      height: 72px;
      border-radius: 30px 30px 38px 38px;
      background: linear-gradient(180deg, #fff4a8, #ffd166 62%, #f59e0b);
      z-index: 3;
      box-shadow: inset -20px -8px 0 rgba(180, 83, 9, .10);
    }

    .cake-shadow {
      position: absolute;
      left: 24px;
      bottom: 12px;
      width: 162px;
      height: 20px;
      border-radius: 50%;
      background: rgba(120, 24, 64, .18);
      filter: blur(4px);
      z-index: 1;
    }

    .plate {
      position: absolute;
      left: 12px;
      bottom: 0;
      width: 186px;
      height: 25px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.56));
      box-shadow: inset 0 -4px 0 rgba(255,255,255,.45);
      z-index: 2;
    }

    .confetti {
      position: fixed;
      top: -24px;
      z-index: 5;
      width: 8px;
      height: 14px;
      border-radius: 3px;
      background: var(--color);
      animation: confettiFall var(--duration) linear infinite;
      animation-delay: var(--delay);
      pointer-events: none;
    }

    .blessing {
      position: fixed;
      z-index: 6;
      left: var(--left);
      bottom: -80px;
      max-width: min(76vw, 320px);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.32);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.38), 0 14px 34px rgba(120,24,64,.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: blessingFloat var(--duration) ease-in forwards;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } }
    @keyframes floatCake { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes flame { from { transform: translateX(-50%) rotate(-8deg) scale(.92); } to { transform: translateX(-50%) rotate(9deg) scale(1.08); } }
    @keyframes confettiFall { from { transform: translateY(-20px) rotate(0deg); opacity: 1; } to { transform: translateY(110vh) rotate(760deg); opacity: .25; } }
    @keyframes blessingFloat {
      0% { transform: translateY(0) scale(.86); opacity: 0; }
      12% { opacity: 1; }
      82% { opacity: 1; }
      100% { transform: translateY(-105vh) scale(1.04); opacity: 0; }
    }

    @media (min-width: 760px) {
      .page { padding: 78px 28px 46px; }
      .card {
        width: min(94vw, 920px);
        min-height: 620px;
        display: grid;
        grid-template-columns: 1.05fr .95fr;
        gap: 34px;
        padding: 56px;
      }
      .content { text-align: left; }
      .wish-tags { justify-content: flex-start; }
      .visual { min-height: 420px; }
      .cake-stage { width: min(40vw, 360px); }
      .cake { transform: scale(1); }
      .blessing { font-size: 18px; padding: 12px 18px; max-width: min(78vw, 360px); }
    }
  </style>
</head>
<body>
  <button class="music-button" id="musicButton" type="button">🎵 点击开启音乐</button>

  <audio id="birthdayMusic" loop preload="auto">
    <source src="birthday_music_0030_0120.m4a" type="audio/mp4">
  </audio>

  <main class="page">
    <section class="card">
      <div class="content">
        <div class="tag">✨ 5月18日 · 专属生日祝福</div>
        <h1>生日快乐<span class="name">晓晓</span></h1>
        <p class="desc">祝晓晓 5月18日生日快乐，天天开心。愿你新的一岁，眼里有光，心里有爱，每一天都被温柔、幸运和惊喜包围。</p>
        <div class="wish-tags">
          <span>天天开心 ✨</span>
          <span>被爱包围 💖</span>
          <span>一路生花 🌸</span>
        </div>
      </div>

      <div class="visual">
        <div class="cake-stage">
          <div class="ring"></div>
          <div class="ring two"></div>
          <div class="cake" aria-label="birthday cake">
            <div class="candle"><div class="flame"></div></div>
            <div class="strawberries"><i></i><i></i><i></i></div>
            <div class="cake-top"></div>
            <div class="drips"><i></i><i></i><i></i><i></i></div>
            <div class="sprinkles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="cake-mid"></div>
            <div class="cream"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="cake-base"></div>
            <div class="cake-shadow"></div>
            <div class="plate"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function setupMusic() {
      const music = document.getElementById('birthdayMusic');
      const button = document.getElementById('musicButton');
      music.volume = 0.85;

      async function playMusic() {
        try {
          await music.play();
          button.textContent = '⏸ 暂停音乐';
          button.classList.add('playing');
        } catch (e) {
          button.textContent = '🎵 点击开启音乐';
          button.classList.remove('playing');
        }
      }

      button.addEventListener('click', async () => {
        if (music.paused) {
          await playMusic();
        } else {
          music.pause();
          button.textContent = '▶ 播放音乐';
          button.classList.remove('playing');
        }
      });

      window.addEventListener('load', playMusic);
      document.addEventListener('touchstart', playMusic, { once: true });
      document.addEventListener('click', playMusic, { once: true });
    }

    function createConfetti() {
      const colors = ['#ffffff', '#fff4a3', '#ff7eb3', '#7dd3fc', '#c4b5fd', '#fcd34d'];
      const count = window.innerWidth < 600 ? 52 : 90;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.setProperty('--color', colors[i % colors.length]);
        piece.style.setProperty('--delay', Math.random() * 4 + 's');
        piece.style.setProperty('--duration', (4 + Math.random() * 4) + 's');
        document.body.appendChild(piece);
      }
    }

    function createBlessings() {
      const messages = [
        '晓晓生日快乐 🎂',
        '5月18日天天开心 ✨',
        '新的一岁闪闪发光 🌟',
        '愿你每天都有好心情 💖',
        '好运一直陪着你 🍀',
        '愿你一路生花 🌸',
        '愿你所遇皆温柔 ☁️',
        '愿你所行皆坦途 🌈',
        '快乐永远偏爱你 💫',
        '生活甜甜的 🍰'
      ];

      function addOne() {
        const item = document.createElement('div');
        item.className = 'blessing';
        item.textContent = messages[Math.floor(Math.random() * messages.length)];
        item.style.setProperty('--left', Math.random() * 58 + 8 + '%');
        item.style.setProperty('--duration', (5 + Math.random() * 3) + 's');
        document.body.appendChild(item);
        setTimeout(() => item.remove(), 9000);
      }

      for (let i = 0; i < 5; i++) setTimeout(addOne, i * 700);
      setInterval(addOne, 1250);
    }

    setupMusic();
    createConfetti();
    createBlessings();
  </script>
</body>
</html>
