<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生日快乐</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #ffe4ec, #fff3bf, #e9d5ff);
    }
    .bg-light { position: fixed; border-radius: 999px; filter: blur(70px); opacity: 0.7; z-index: 0; }
    .light-1 { width: 300px; height: 300px; left: -100px; top: -100px; background: #fb7185; }
    .light-2 { width: 360px; height: 360px; right: -80px; top: 80px; background: #fde68a; }
    .light-3 { width: 320px; height: 320px; left: 35%; bottom: -120px; background: #c4b5fd; }
    .page { position: relative; z-index: 2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; }
    .card {
      width: min(100%, 1050px);
      min-height: 620px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 40px;
      align-items: center;
      padding: 48px;
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 36px;
      background: rgba(255,255,255,0.66);
      box-shadow: 0 30px 90px rgba(190,24,93,0.18);
      backdrop-filter: blur(18px);
    }
    .tag { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.82); color: #db2777; font-size: 15px; font-weight: 700; box-shadow: 0 10px 30px rgba(219,39,119,0.12); }
    h1 { font-size: clamp(44px, 12vw, 86px); line-height: 1.05; letter-spacing: -2px; color: #111827; }
    .gradient-text { display: block; background: linear-gradient(90deg,#ec4899,#f43f5e,#f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .desc { max-width: 560px; margin-top: 24px; font-size: 20px; line-height: 1.85; color: #4b5563; }
    .controls { display: flex; gap: 14px; margin-top: 30px; flex-wrap: wrap; }
    input { min-width: 220px; padding: 15px 18px; border: 1px solid rgba(255,255,255,0.95); border-radius: 18px; outline: none; background: rgba(255,255,255,0.85); font-size: 16px; box-shadow: 0 10px 24px rgba(15,23,42,0.08); }
    input:focus { box-shadow: 0 0 0 5px rgba(244,114,182,0.24); }
    button { border: 0; border-radius: 18px; padding: 15px 22px; background: #111827; color: white; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 16px 35px rgba(17,24,39,0.22); transition: 0.25s ease; }
    button:hover { transform: translateY(-3px); background: #db2777; }
    .wish-box { display: none; margin-top: 30px; padding: 22px; border-radius: 26px; background: rgba(255,255,255,0.78); box-shadow: 0 12px 35px rgba(15,23,42,0.08); }
    .wish-box.show { display: block; }
    .wish-box p { font-size: 17px; line-height: 1.8; color: #4b5563; }
    .cake-area { position: relative; width: min(100%,390px); aspect-ratio: 1/1; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle,rgba(255,255,255,0.88),rgba(255,255,255,0.25)); box-shadow: inset 0 0 45px rgba(255,255,255,0.75); }
    .circle-line { position: absolute; inset: 34px; border: 1px dashed #f9a8d4; border-radius: 50%; animation: spin 22s linear infinite; }
    .cake-card { position: relative; width: 235px; padding: 30px 24px; text-align: center; border-radius: 30px; background: white; box-shadow: 0 24px 55px rgba(157,23,77,0.18); }
    .cake-icon { width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; border-radius: 50%; background: #fce7f3; font-size: 52px; animation: floatCake 2.2s ease-in-out infinite; }
    .cake-card h2 { font-size: 25px; color: #111827; margin-bottom: 8px; }
    .cake-card p { font-size: 14px; color: #6b7280; line-height: 1.6; }
    .dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
    .dots span { width: 11px; height: 11px; border-radius: 50%; background: #f472b6; animation: pulse 1.2s ease-in-out infinite; }
    .dots span:nth-child(2){animation-delay:0.15s;}
    .dots span:nth-child(3){animation-delay:0.3s;}
    .dots span:nth-child(4){animation-delay:0.45s;}
    .dots span:nth-child(5){animation-delay:0.6s;}
    .balloon { position: fixed; bottom: -130px; z-index: 1; display: flex; flex-direction: column; align-items: center; animation-name: balloonFly; animation-timing-function: ease-in-out; animation-iteration-count: infinite; pointer-events: none; }
    .balloon-body { width: var(--size); height: calc(var(--size)*1.18); border-radius: 50% 50% 45% 45%; background: var(--color); box-shadow: inset -8px -12px 18px rgba(0,0,0,0.12),0 14px 25px rgba(0,0,0,0.12); }
    .balloon-string { width: 1px; height: 68px; background: rgba(75,85,99,0.45); }
    .confetti { position: fixed; top: -20px; z-index: 5; width: 8px; height: 13px; border-radius: 2px; opacity: 0; pointer-events: none; }
    .confetti.active { animation-name: confettiFall; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes floatCake { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.45); opacity: 1; } }
    @keyframes balloonFly { 0% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-52vh) translateX(18px); } 100% { transform: translateY(-110vh) translateX(-12px); } }
    @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0.25; } }
    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .page { align-items: flex-start; padding: 16px; }
      .card { grid-template-columns: 1fr; min-height: auto; gap: 28px; padding: 28px 22px; border-radius: 28px; }
      .desc { font-size: 17px; }
      .cake-area { width: min(100%, 310px); }
      .cake-card { width: 215px; }
      .controls { flex-direction: column; }
      input, button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg-light light-1"></div>
  <div class="bg-light light-2"></div>
  <div class="bg-light light-3"></div>

  <main class="page">
    <section class="card">
      <div>
        <div class="tag">✨ 今天是特别的一天</div>
        <h1>生日快乐 <span class="gradient-text" id="titleName">亲爱的朋友！</span></h1>
        <p class="desc">愿你新的一岁，眼里有光，心中有爱，生活有惊喜，所有美好都如约而至。</p>
        <div class="controls">
          <input id="nameInput" type="text" placeholder="输入寿星名字" value="亲爱的朋友">
          <button id="openBtn">🎁 打开祝福</button>
        </div>
        <div class="wish-box" id="wishBox">
          <p>💖 愿你的每一天都像蛋糕一样甜，像烛光一样暖，像星星一样闪闪发亮。新的一岁，继续做最可爱的自己！</p>
        </div>
      </div>

      <div class="cake-area">
        <div class="circle-line"></div>
        <div class="cake-card">
          <div class="cake-icon">🎂</div>
          <h2>Make a wish</h2>
          <p>闭上眼睛，许下一个超甜的愿望</p>
          <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const nameInput = document.getElementById("nameInput");
    const titleName = document.getElementById("titleName");
    const openBtn = document.getElementById("openBtn");
    const wishBox = document.getElementById("wishBox");

    nameInput.addEventListener("input", function () {
      const name = nameInput.value.trim() || "亲爱的朋友";
      titleName.textContent = name + "！";
    });

    openBtn.addEventListener("click", function () {
      wishBox.classList.add("show");
      createConfetti();
    });

    function createBalloons() {
      const colors = ["#fb7185", "#facc15", "#a78bfa", "#38bdf8", "#f472b6"];
      const count = window.innerWidth < 600 ? 8 : 14;
      for (let i = 0; i < count; i++) {
        const balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.style.left = 5 + i * (90 / count) + "%";
        balloon.style.animationDelay = (i % 5) * 0.45 + "s";
        balloon.style.animationDuration = 7 + (i % 4) + "s";
        balloon.style.setProperty("--size", 30 + (i % 3) * 10 + "px");
        balloon.style.setProperty("--color", colors[i % colors.length]);
        balloon.innerHTML = '<div class="balloon-body"></div><div class="balloon-string"></div>';
        document.body.appendChild(balloon);
      }
    }

    function createConfetti() {
      document.querySelectorAll(".confetti").forEach(function (item) { item.remove(); });
      const colors = ["#fb7185", "#facc15", "#a78bfa", "#38bdf8", "#f472b6", "#ffffff"];
      const count = window.innerWidth < 600 ? 45 : 80;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti active";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = Math.random() * 2.2 + "s";
        piece.style.animationDuration = 2.6 + Math.random() * 2.6 + "s";
        document.body.appendChild(piece);
      }
    }

    function runTests() {
      console.assert(document.getElementById("nameInput"), "测试失败：名字输入框不存在");
      console.assert(document.getElementById("openBtn"), "测试失败：祝福按钮不存在");
      console.assert(document.getElementById("wishBox"), "测试失败：祝福区域不存在");
      nameInput.value = "小明";
      nameInput.dispatchEvent(new Event("input"));
      console.assert(titleName.textContent === "小明！", "测试失败：名字没有正确更新");
    }

    createBalloons();
    runTests();
  </script>
</body>
</html>
