</style></head><body><button class="music-button" id="musicButton" type="button">🎵 点击开启音乐</button><audio id="birthdayMusic" loop preload="auto"><source src="birthday_music_0030_0120.m4a" type="audio/mp4"></audio><main class="page"><section class="card"><div class="content"><div class="tag">✨ 5月18日 · 专属生日祝福</div><h1>生日快乐<span class="name">晓晓</span></h1><p class="desc">祝晓晓 5月18日生日快乐，天天开心。愿你新的一岁，眼里有光，心里有爱，每一天都被温柔、幸运和惊喜包围。</p><div class="wish-tags"><span>愿你天天开心 ✨</span><span>愿你被爱包围 💖</span><span>愿你一路生花 🌸</span></div></div><div class="visual"><div class="cake-stage"><div class="ring"></div><div class="ring two"></div><div class="cake" aria-label="birthday cake"><div class="candle"><div class="flame"></div></div><div class="strawberries"><i></i><i></i><i></i></div><div class="cake-top"></div><div class="drips"><i></i><i></i><i></i><i></i></div><div class="sprinkles"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="cake-mid"></div><div class="cream"><i></i><i></i><i></i><i></i><i></i></div><div class="cake-base"></div><div class="cake-shadow"></div><div class="plate"></div></div></div></div></section></main><form class="blessing-form" id="blessingForm"><input id="blessingInput" type="text" maxlength="80" placeholder="在这里输入生日祝福..."><button type="submit">发送祝福</button></form><div class="modal-mask" id="blessingModal"><div class="modal-card"><h2>💌 生日祝福详情</h2><p id="modalText"></p><button id="closeModal" type="button">关闭</button></div></div><script>
function setupInteractiveBlessings(){const form=document.getElementById('blessingForm'),input=document.getElementById('blessingInput'),modal=document.getElementById('blessingModal'),modalText=document.getElementById('modalText'),closeModal=document.getElementById('closeModal');const saved=JSON.parse(localStorage.getItem('xiaoxiaoBlessings')||'[]');function showDetail(text){modalText.textContent=text;modal.classList.add('show')}function addRollingBlessing(text){const item=document.createElement('div');item.className='user-blessing';item.textContent='💌 '+text;item.title=text;item.style.setProperty('--top',(18+Math.random()*58)+'vh');item.style.setProperty('--duration',(14+Math.random()*8)+'s');item.style.animationDelay=(Math.random()*-12)+'s';item.addEventListener('click',()=>showDetail(text));document.body.appendChild(item);}form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;saved.push(text);localStorage.setItem('xiaoxiaoBlessings',JSON.stringify(saved.slice(-30)));addRollingBlessing(text);input.value=''});closeModal.addEventListener('click',()=>modal.classList.remove('show'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});if(saved.length===0){['祝晓晓生日快乐，天天开心！','愿你新的一岁闪闪发光！','愿所有美好都奔向你！'].forEach((text,i)=>setTimeout(()=>addRollingBlessing(text),600+i*900))}else{saved.slice(-12).forEach((text,i)=>setTimeout(()=>addRollingBlessing(text),600+i*700))}}
function setupMusic(){const music=document.getElementById('birthdayMusic'),button=document.getElementById('musicButton');music.volume=.85;async function playMusic(){try{await music.play();button.textContent='⏸ 暂停音乐';button.classList.add('playing')}catch(e){button.textContent='🎵 点击开启音乐';button.classList.remove('playing')}}button.addEventListener('click',async()=>{if(music.paused){await playMusic()}else{music.pause();button.textContent='▶ 播放音乐';button.classList.remove('playing')}});window.addEventListener('load',playMusic);document.addEventListener('touchstart',playMusic,{once:true});document.addEventListener('click',playMusic,{once:true})}
function createConfetti(){const colors=['#ffffff','#fff4a3','#ff7eb3','#7dd3fc','#c4b5fd','#fcd34d'];const count=window.innerWidth<600?48:90;for(let i=0;i<count;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.setProperty('--color',colors[i%colors.length]);p.style.setProperty('--delay',Math.random()*4+'s');p.style.setProperty('--duration',(4+Math.random()*4)+'s');document.body.appendChild(p)}}
function createBlessings(){const messages=['晓晓生日快乐 🎂','5月18日天天开心 ✨','愿你每天都有好心情 💖','新的一岁闪闪发光 🌟','所有愿望都慢慢实现 🎁','开心快乐每一天 🥳','好运一直陪着你 🍀','愿你眼里有光 ✨','愿你心里有爱 💗','愿你一路生花 🌸','愿你所遇皆温柔 ☁️','愿你所行皆坦途 🌈','愿你笑容常在 😄','愿你热爱不减 🌻','愿你自由又明亮 🕊️','愿今天所有美好都属于你 🎀','愿快乐永远偏爱你 💫','愿生活甜甜的 🍰'];function add(){const item=document.createElement('div');item.className='blessing';item.textContent=messages[Math.floor(Math.random()*messages.length)];item.style.setProperty('--left',Math.random()*70+8+'%');item.style.setProperty('--duration',5+Math.random()*3+'s');document.body.appendChild(item);setTimeout(()=>item.remove(),9000)}for(let i=0;i<5;i++)setTimeout(add,i*650);setInterval(add,1200)}
setupInteractiveBlessings();setupMusic();createConfetti();createBlessings();
</script></body></html>
