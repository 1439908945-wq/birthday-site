<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祝晓晓生日快乐</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.95), transparent 18%),
        radial-gradient(circle at 78% 18%, rgba(255,215,235,.95), transparent 22%),
        radial-gradient(circle at 52% 88%, rgba(255,238,179,.95), transparent 25%),
        linear-gradient(135deg, #ff7eb3 0%, #ff758c 32%, #ffb86c 68%, #ffe29f 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, black, transparent 76%);
      pointer-events: none;
    }
    .music-button {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 18px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      color: #db2777;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(120,24,64,.22);
      backdrop-filter: blur(14px);
    }
    .music-button.playing { background: #fff8c7; color: #9a3412; }
    .page { position: relative; z-index: 2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px; }
    .card {
      position: relative;
      width: min(94vw, 920px);
      min-height: 620px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 34px;
      padding: 56px;
      border: 1px solid rgba(255,255,255,.56);
      border-radius: 42px;
      background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.14));
      box-shadow: 0 30px 90px rgba(155, 25, 76, .28);
      backdrop-filter: blur(22px);
      overflow: hidden;
      animation: cardIn .9s ease both;
    }
    .content, .visual { position: relative; z-index: 2; }
    .tag { display: inline-flex; margin-bottom: 22px; padding: 11px 18px; border-radius: 999px; background: rgba(255,255,255,.28); font-size: 15px; font-weight: 800; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
    h1 { font-size: clamp(54px, 9vw, 96px); line-height: .98; letter-spacing: -4px; text-shadow: 0 12px 32px rgba(141,24,69,.22); }
    .name { display: block; margin-top: 10px; color: #fff8c7; }
    .desc { max-width: 570px; margin-top: 28px; font-size: 22px; line-height: 1.85; color: rgba(255,255,255,.95); font-weight: 700; }
    .wish-tags { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .wish-tags span { display: inline-flex; align-items: center; padding: 12px 16px; border-radius: 999px; background: rgba(255,255,255,.26); box-shadow: inset 0 0 0 1px rgba(255,255,255,.34), 0 10px 28px rgba(128,24,64,.12); color: rgba(255,255,255,.96); font-size: 15px; font-weight: 900; backdrop-filter: blur(12px); }
    .visual { display: flex; align-items: center; justify-content: center; min-height: 420px; }
    .cake-stage { position: relative; width: min(86vw, 360px); aspect-ratio: 1 / 1; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.52), rgba(255,255,255,.08) 62%, transparent 63%); animation: sway 4.5s ease-in-out infinite; }
    .ring { position: absolute; inset: 20px; border: 2px dashed rgba(255,255,255,.55); border-radius: 50%; animation: spin 24s linear infinite; }
    .ring.two { inset: 48px; border-style: solid; opacity: .32; animation-duration: 18s; animation-direction: reverse; }
    .cake { position: relative; width: 210px; height: 220px; filter: drop-shadow(0 24px 26px rgba(121,31,61,.22)); animation: floatCake 2.8s ease-in-out infinite; }
    .candle { position: absolute; left: 50%; top: 6px; width: 18px; height: 58px; transform: translateX(-50%); border-radius: 8px; background: repeating-linear-gradient(45deg,#fff,#fff 8px,#ff7eb3 8px,#ff7eb3 16px); z-index: 4; }
    .flame { position: absolute; left: 50%; top: -26px; width: 28px; height: 36px; transform: translateX(-50%) rotate(8deg); border-radius: 50% 50% 50% 0; background: #fff4a3; box-shadow: 0 0 24px #fff4a3, 0 0 44px #ff9f1c; animation: flame 1s ease-in-out infinite alternate; }
    .cake-top { position: absolute; left: 20px; top: 70px; width: 170px; height: 54px; border-radius: 50%; background: #fff5f8; z-index: 3; }
    .cake-mid { position: absolute; left: 20px; top: 95px; width: 170px; height: 78px; border-radius: 0 0 28px 28px; background: linear-gradient(180deg,#ff9ac1,#ff5f9d); z-index: 2; }
    .cake-base { position: absolute; left: 0; bottom: 12px; width: 210px; height: 74px; border-radius: 26px 26px 34px 34px; background: linear-gradient(180deg,#fff1a8,#ffd166); z-index: 1; }
    .cream { position: absolute; top: 108px; left: 32px; z-index: 4; display: flex; gap: 15px; }
    .cream i { width: 22px; height: 30px; border-radius: 0 0 14px 14px; background: #fff5f8; }
    .plate { position: absolute; left: 20px; bottom: 0; width: 170px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.72); }
    .confetti { position: fixed; top: -24px; z-index: 5; width: 9px; height: 16px; border-radius: 3px; background: var(--color); animation: confettiFall var(--duration) linear infinite; animation-delay: var(--delay); pointer-events: none; }
    .blessing { position: fixed; z-index: 6; left: var(--left); bottom: -80px; max-width: min(78vw,360px); padding: 12px 18px; border-radius: 999px; background: rgba(255,255,255,.32); color: #fff; font-size: 18px; font-weight: 900; box-shadow: inset 0 0 0 1px rgba(255,255,255,.38), 0 14px 34px rgba(120,24,64,.16); backdrop-filter: blur(14px); animation: blessingFloat var(--duration) ease-in forwards; pointer-events: none; white-space: nowrap; }
    @keyframes cardIn { from { opacity:0; transform: translateY(30px) scale(.97); } to { opacity:1; transform: translateY(0) scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } }
    @keyframes floatCake { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes flame { from { transform: translateX(-50%) rotate(-8deg) scale(.92); } to { transform: translateX(-50%) rotate(9deg) scale(1.08); } }
    @keyframes confettiFall { from { transform: translateY(-20px) rotate(0deg); opacity: 1; } to { transform: translateY(110vh) rotate(760deg); opacity: .25; } }
    @keyframes blessingFloat { 0% { transform: translateY(0) scale(.85); opacity:0; } 12% { opacity:1; } 82% { opacity:1; } 100% { transform: translateY(-105vh) scale(1.06); opacity:0; } }
    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .page { align-items: flex-start; padding: 70px 18px 18px; }
      .card { grid-template-columns: 1fr; min-height: auto; padding: 34px 24px; border-radius: 32px; gap: 20px; }
      h1 { font-size: clamp(48px,15vw,68px); letter-spacing: -2px; }
      .desc { font-size: 18px; line-height: 1.75; }
      .visual { min-height: 330px; }
      .cake-stage { width: min(82vw,310px); }
      .blessing { font-size: 15px; padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <button class="music-button" id="musicButton" type="button">🎵 点击开启音乐</button>
  <audio id="birthdayMusic" loop preload="auto">
    <source src="birthday_music_0030_0120.m4a" type="audio/mp4">
  </audio>

  <main class="page">
    <section class="card">
      <div class="content">
        <div class="tag">✨ 5月18日 · 专属生日祝福</div>
        <h1>生日快乐<span class="name">晓晓</span></h1>
        <p class="desc">祝晓晓 5月18日生日快乐，天天开心。愿你新的一岁，眼里有光，心里有爱，每一天都被温柔、幸运和惊喜包围。</p>
        <div class="wish-tags">
          <span>愿你天天开心 ✨</span>
          <span>愿你被爱包围 💖</span>
          <span>愿你一路生花 🌸</span>
        </div>
      </div>
      <div class="visual">
        <div class="cake-stage">
          <div class="ring"></div><div class="ring two"></div>
          <div class="cake">
            <div class="candle"><div class="flame"></div></div>
            <div class="cake-top"></div>
            <div class="cream"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="cake-mid"></div><div class="cake-base"></div><div class="plate"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function setupMusic() {
      const music = document.getElementById('birthdayMusic');
      const button = document.getElementById('musicButton');
      music.volume = 0.85;

      async function playMusic() {
        try {
          await music.play();
          button.textContent = '⏸ 暂停音乐';
          button.classList.add('playing');
        } catch (e) {
          button.textContent = '🎵 点击开启音乐';
          button.classList.remove('playing');
        }
      }

      button.addEventListener('click', async () => {
        if (music.paused) {
          await playMusic();
        } else {
          music.pause();
          button.textContent = '▶ 播放音乐';
          button.classList.remove('playing');
        }
      });

      window.addEventListener('load', playMusic);
      document.addEventListener('touchstart', playMusic, { once: true });
      document.addEventListener('click', playMusic, { once: true });
    }

    function createConfetti() {
      const colors = ['#ffffff', '#fff4a3', '#ff7eb3', '#7dd3fc', '#c4b5fd', '#fcd34d'];
      const count = window.innerWidth < 600 ? 48 : 90;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.setProperty('--color', colors[i % colors.length]);
        piece.style.setProperty('--delay', Math.random() * 4 + 's');
        piece.style.setProperty('--duration', (4 + Math.random() * 4) + 's');
        document.body.appendChild(piece);
      }
    }

    function createBlessings() {
      const messages = [
        '晓晓生日快乐 🎂',
        '5月18日天天开心 ✨',
        '愿你每天都有好心情 💖',
        '新的一岁闪闪发光 🌟',
        '所有愿望都慢慢实现 🎁',
        '开心快乐每一天 🥳',
        '好运一直陪着你 🍀',
        '愿你眼里有光 ✨',
        '愿你心里有爱 💗',
        '愿你一路生花 🌸',
        '愿你所遇皆温柔 ☁️',
        '愿你所行皆坦途 🌈',
        '愿你笑容常在 😄',
        '愿你热爱不减 🌻',
        '愿你自由又明亮 🕊️',
        '愿今天所有美好都属于你 🎀',
        '愿快乐永远偏爱你 💫',
        '愿生活甜甜的 🍰'
      ];

      function addOneBlessing() {
        const item = document.createElement('div');
        item.className = 'blessing';
        item.textContent = messages[Math.floor(Math.random() * messages.length)];
        item.style.setProperty('--left', Math.random() * 70 + 8 + '%');
        item.style.setProperty('--duration', (5 + Math.random() * 3) + 's');
        document.body.appendChild(item);
        setTimeout(() => item.remove(), 9000);
      }
      for (let i = 0; i < 5; i++) setTimeout(addOneBlessing, i * 650);
      setInterval(addOneBlessing, 1200);
    }

    setupMusic();
    createConfetti();
    createBlessings();
  </script>
</body>
</html>
