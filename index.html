<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祝晓晓生日快乐</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.95), transparent 18%),
        radial-gradient(circle at 78% 18%, rgba(255,215,235,.95), transparent 22%),
        radial-gradient(circle at 52% 88%, rgba(255,238,179,.95), transparent 25%),
        linear-gradient(135deg, #ff7eb3 0%, #ff758c 32%, #ffb86c 68%, #ffe29f 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, black, transparent 76%);
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .card {
      position: relative;
      width: min(94vw, 920px);
      min-height: 620px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 34px;
      padding: 56px;
      border: 1px solid rgba(255,255,255,.56);
      border-radius: 42px;
      background: rgba(255,255,255,.22);
      box-shadow: 0 30px 90px rgba(155, 25, 76, .28);
      backdrop-filter: blur(22px);
      overflow: hidden;
      animation: cardIn .9s ease both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -80px;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.42), transparent 38%);
      pointer-events: none;
    }

    .content, .visual { position: relative; z-index: 2; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.28);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .5px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 10px 26px rgba(156, 31, 82, .14);
    }

    h1 {
      font-size: clamp(54px, 9vw, 96px);
      line-height: .98;
      letter-spacing: -4px;
      text-shadow: 0 12px 32px rgba(141, 24, 69, .22);
    }

    .name {
      display: block;
      margin-top: 10px;
      color: #fff8c7;
      text-shadow: 0 8px 28px rgba(106, 42, 16, .18);
    }

    .desc {
      max-width: 570px;
      margin-top: 28px;
      font-size: 22px;
      line-height: 1.85;
      color: rgba(255,255,255,.94);
      font-weight: 600;
    }

    .date-card {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
      padding: 16px 20px;
      border-radius: 24px;
      background: rgba(255,255,255,.28);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.34);
      font-weight: 900;
      color: #fff;
    }

    .date-card span:first-child {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: rgba(255,255,255,.28);
      font-size: 24px;
    }

    .visual {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
    }

    .cake-stage {
      position: relative;
      width: min(86vw, 360px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.52), rgba(255,255,255,.08) 62%, transparent 63%);
      animation: sway 4.5s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      inset: 20px;
      border: 2px dashed rgba(255,255,255,.55);
      border-radius: 50%;
      animation: spin 24s linear infinite;
    }

    .ring.two {
      inset: 48px;
      border-style: solid;
      opacity: .32;
      animation-duration: 18s;
      animation-direction: reverse;
    }

    .cake {
      position: relative;
      width: 210px;
      height: 220px;
      filter: drop-shadow(0 24px 26px rgba(121, 31, 61, .22));
      animation: floatCake 2.8s ease-in-out infinite;
    }

    .candle {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 18px;
      height: 58px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: repeating-linear-gradient(45deg, #fff, #fff 8px, #ff7eb3 8px, #ff7eb3 16px);
      z-index: 4;
    }

    .flame {
      position: absolute;
      left: 50%;
      top: -26px;
      width: 28px;
      height: 36px;
      transform: translateX(-50%) rotate(8deg);
      border-radius: 50% 50% 50% 0;
      background: #fff4a3;
      box-shadow: 0 0 24px #fff4a3, 0 0 44px #ff9f1c;
      animation: flame 1s ease-in-out infinite alternate;
    }

    .cake-top {
      position: absolute;
      left: 20px;
      top: 70px;
      width: 170px;
      height: 54px;
      border-radius: 50%;
      background: #fff5f8;
      z-index: 3;
    }

    .cake-mid {
      position: absolute;
      left: 20px;
      top: 95px;
      width: 170px;
      height: 78px;
      border-radius: 0 0 28px 28px;
      background: linear-gradient(180deg, #ff9ac1, #ff5f9d);
      z-index: 2;
    }

    .cake-base {
      position: absolute;
      left: 0;
      bottom: 12px;
      width: 210px;
      height: 74px;
      border-radius: 26px 26px 34px 34px;
      background: linear-gradient(180deg, #fff1a8, #ffd166);
      z-index: 1;
    }

    .cream {
      position: absolute;
      top: 108px;
      left: 32px;
      z-index: 4;
      display: flex;
      gap: 15px;
    }

    .cream i {
      width: 22px;
      height: 30px;
      border-radius: 0 0 14px 14px;
      background: #fff5f8;
    }

    .plate {
      position: absolute;
      left: 20px;
      bottom: 0;
      width: 170px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,.72);
    }

    .heart {
      position: fixed;
      z-index: 1;
      color: rgba(255,255,255,.58);
      font-size: var(--size);
      animation: heartFloat var(--duration) ease-in-out infinite;
      pointer-events: none;
    }

    .confetti {
      position: fixed;
      top: -24px;
      z-index: 5;
      width: 9px;
      height: 16px;
      border-radius: 3px;
      background: var(--color);
      animation: confettiFall var(--duration) linear infinite;
      animation-delay: var(--delay);
      pointer-events: none;
    }

    .blessing {
      position: fixed;
      z-index: 6;
      left: var(--left);
      bottom: -80px;
      max-width: min(78vw, 360px);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .32);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .4px;
      text-shadow: 0 3px 10px rgba(120, 24, 64, .22);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.38), 0 14px 34px rgba(120,24,64,.16);
      backdrop-filter: blur(14px);
      animation: blessingFloat var(--duration) ease-in forwards;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } }
    @keyframes floatCake { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes flame { from { transform: translateX(-50%) rotate(-8deg) scale(.92); } to { transform: translateX(-50%) rotate(9deg) scale(1.08); } }
    @keyframes confettiFall { from { transform: translateY(-20px) rotate(0deg); opacity: 1; } to { transform: translateY(110vh) rotate(760deg); opacity: .25; } }
    @keyframes heartFloat { 0%,100% { transform: translateY(0) scale(1); opacity: .3; } 50% { transform: translateY(-28px) scale(1.15); opacity: .7; } }
    @keyframes blessingFloat {
      0% { transform: translateY(0) scale(.85); opacity: 0; }
      12% { opacity: 1; }
      82% { opacity: 1; }
      100% { transform: translateY(-105vh) scale(1.06); opacity: 0; }
    }

    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .page { align-items: flex-start; padding: 18px; }
      .card { grid-template-columns: 1fr; min-height: auto; padding: 34px 24px; border-radius: 32px; gap: 20px; }
      h1 { font-size: clamp(48px, 15vw, 68px); letter-spacing: -2px; }
      .desc { font-size: 18px; line-height: 1.75; }
      .visual { min-height: 330px; }
      .cake-stage { width: min(82vw, 310px); }
      .cake { transform: scale(.88); }
      .blessing { font-size: 15px; padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="content">
        <div class="tag">✨ 5月18日 · 专属生日祝福</div>
        <h1>生日快乐<span class="name">晓晓</span></h1>
        <p class="desc">祝晓晓 5月18日生日快乐，天天开心。愿你新的一岁，眼里有光，心里有爱，每一天都被温柔和幸运包围。</p>
        <div class="date-card"><span>🎁</span><div>Happy Birthday · May 18</div></div>
      </div>

      <div class="visual">
        <div class="cake-stage">
          <div class="ring"></div>
          <div class="ring two"></div>
          <div class="cake" aria-label="birthday cake">
            <div class="candle"><div class="flame"></div></div>
            <div class="cake-top"></div>
            <div class="cream"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="cake-mid"></div>
            <div class="cake-base"></div>
            <div class="plate"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function createConfetti() {
      const colors = ['#ffffff', '#fff4a3', '#ff7eb3', '#7dd3fc', '#c4b5fd', '#fcd34d'];
      const count = window.innerWidth < 600 ? 48 : 90;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.setProperty('--color', colors[i % colors.length]);
        piece.style.setProperty('--delay', Math.random() * 4 + 's');
        piece.style.setProperty('--duration', (4 + Math.random() * 4) + 's');
        document.body.appendChild(piece);
      }
    }

    function createHearts() {
      const icons = ['♡', '✦', '✧', '♥'];
      const count = window.innerWidth < 600 ? 10 : 16;
      for (let i = 0; i < count; i++) {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = icons[i % icons.length];
        h.style.left = Math.random() * 96 + '%';
        h.style.top = Math.random() * 92 + '%';
        h.style.setProperty('--size', (18 + Math.random() * 22) + 'px');
        h.style.setProperty('--duration', (3 + Math.random() * 4) + 's');
        document.body.appendChild(h);
      }
    }

    function createBlessings() {
      const messages = [
        '晓晓生日快乐 🎂',
        '5月18日天天开心 ✨',
        '愿你每天都被温柔包围 💖',
        '新的一岁闪闪发光 🌟',
        '所有愿望都实现 🎁',
        '开心快乐每一天 🥳',
        '好运一直陪着你 🍀'
      ];

      function addOneBlessing() {
        const item = document.createElement('div');
        item.className = 'blessing';
        item.textContent = messages[Math.floor(Math.random() * messages.length)];
        item.style.setProperty('--left', Math.random() * 70 + 8 + '%');
        item.style.setProperty('--duration', (5 + Math.random() * 3) + 's');
        document.body.appendChild(item);
        setTimeout(() => item.remove(), 9000);
      }

      for (let i = 0; i < 5; i++) setTimeout(addOneBlessing, i * 650);
      setInterval(addOneBlessing, 1200);
    }

    function runTests() {
      console.assert(document.title === '祝晓晓生日快乐', '测试失败：网页标题不正确');
      console.assert(document.body.textContent.includes('祝晓晓 5月18日生日快乐'), '测试失败：祝福文案缺失');
      console.assert(document.querySelector('.cake'), '测试失败：蛋糕元素不存在');
      console.assert(!document.querySelector('input'), '测试失败：不应再显示输入框');
      console.assert(!document.querySelector('button'), '测试失败：不应再显示按钮');
      console.assert(typeof createBlessings === 'function', '测试失败：不断出现的祝福功能不存在');
    }

    createConfetti();
    createHearts();
    createBlessings();
    runTests();
  </script>
<audio id="birthdayMusic" loop preload="auto"><source src="birthday_bgm.wav" type="audio/wav"></audio></body>
</html>
